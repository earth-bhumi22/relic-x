[project]
name = "relicx"
version = "0.1.0"
description = "RELIC-X — interactive, explainable reconstruction of fragmented cultural artifacts (DSA-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bhumi Kansal" }, { name = "Arvind Kaushik" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Web API + persistence. Kept separate so the algorithm engine can be
# installed and benchmarked on its own (pip install -e .).
api = [
    "fastapi>=0.121",  # Depends(scope="function")
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.coverage.run]
source = ["relicx"]
