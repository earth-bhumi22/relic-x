# Owner: B (backend jobs), A (frontend job)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[api,dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (black)
        run: black --check .
      - name: Tests (engine, API, migrations)
        run: pytest --cov=relicx --cov-report=term-missing

  postgres:
    name: Backend · migrations on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relicx
          # Throwaway value for this ephemeral CI-only container; not a real secret.
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: relicx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relicx -d relicx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RELICX_DATABASE_URL: postgresql+psycopg://relicx:change_me@localhost:5432/relicx_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[api,dev]"
      - name: Upgrade, downgrade, upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      # T30 (B) adds the full API test-suite against this database here.

  frontend:
    name: Frontend · lint + type-check + tests + build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Tests and the smoke test run on mock data, so CI never needs the backend.
      VITE_USE_MOCKS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Tests + coverage (Vitest)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && docker compose config --quiet
