name: Bug report
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. \n2. \n3. "
  - type: input
    id: request
    attributes:
      label: X-Request-ID (from the API response headers), if any
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, engine, CI / Docker, docs]
