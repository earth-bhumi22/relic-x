name: Task (from WORKFLOW.md)
description: A planned task with an ID from planning/WORKFLOW.md
title: "T__ · "
labels: ["type:task"]
body:
  - type: input
    id: owner
    attributes:
      label: Owner
      description: A (Arvind) or B (Bhumi)
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations: { required: true }
  - type: textarea
    id: todo
    attributes:
      label: To do
      value: "- [ ] "
  - type: textarea
    id: done
    attributes:
      label: Done when
  - type: input
    id: needs
    attributes:
      label: Needs (dependencies)
